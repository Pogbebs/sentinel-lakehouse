# Sentinel Lakehouse: full local stack.
#   make up        start everything
#   make down      stop (keep data)       make nuke   stop and delete volumes
# Needs ~8 GB of memory allocated to Docker.
#
# Only the three web UIs are published to your machine, on uncommon ports so they do not
# clash with other local stacks (Postgres 5432, Airflow 8080, ...). Everything else talks
# over the internal compose network. Override any of them in .env.

x-sentinel-env: &sentinel-env
  KAFKA_BOOTSTRAP: kafka:9092
  AUTH_TOPIC: auth.events.v1
  ALERTS_TOPIC: security.alerts.v1
  LAKE_ROOT: s3a://lake
  TABLE_FORMAT: delta
  CHECKPOINT_ROOT: s3a://lake/_checkpoints
  S3_ENDPOINT: http://s3:8333
  S3_ENDPOINT_HOST: s3:8333
  # Must match infra/seaweedfs/s3.json
  S3_ACCESS_KEY: sentinel
  S3_SECRET_KEY: sentinel-secret
  SENTINEL_PG_DSN: postgresql://sentinel:${SENTINEL_DB_PASSWORD:-sentinel}@postgres:5432/sentinel
  WATERMARK_DELAY: 2 minutes
  TRIGGER_INTERVAL: 30 seconds
  MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-200000}
  # Streaming watchdog (sentinel.streaming.health): restart after this long without a heartbeat.
  STALL_TIMEOUT_SECONDS: "600"
  STALL_START_GRACE_SECONDS: "600"

services:
  # ------------------------------------------------------------------ messaging
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx768m -Xms256m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic auth.events.v1 \
            --partitions 6 --replication-factor 1 --config retention.ms=604800000 \
            --config compression.type=lz4
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic security.alerts.v1 \
            --partitions 3 --replication-factor 1 --config cleanup.policy=compact,delete
        $$K --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["ui"]
    ports: ["127.0.0.1:${KAFKA_UI_PORT:-18085}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # ------------------------------------------------------------------ storage
  # S3-compatible object store. (MinIO's images were withdrawn from Docker Hub in 2025.)
  s3:
    image: chrislusf/seaweedfs:4.22
    hostname: s3
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The S3 port treats /anything as a bucket name, so probe the master instead.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  s3-init:
    build: { context: ., dockerfile: docker/generator/Dockerfile }
    depends_on:
      s3: { condition: service_healthy }
    environment: *sentinel-env
    command: ["python", "/opt/sentinel/scripts/create_bucket.py", "lake"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SENTINEL_DB_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    # Published on an uncommon port, localhost only, for SQL clients such as DBeaver.
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d sentinel -c 'select 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------------ compute
  generator:
    build: { context: ., dockerfile: docker/generator/Dockerfile }
    environment:
      <<: *sentinel-env
      LAKE_ROOT: s3://lake
    command: >
      sentinel-generate kafka --minutes 525600 --speed 1
      --events-per-minute ${EVENTS_PER_MINUTE:-300}
      --attacks-per-hour ${ATTACKS_PER_HOUR:-6}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
    restart: unless-stopped

  spark-streaming:
    build: { context: ., dockerfile: docker/spark/Dockerfile }
    environment: *sentinel-env
    ports: ["127.0.0.1:${SPARK_UI_PORT:-14040}:4040"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    # The job's own watchdog exits (and so restarts) after STALL_TIMEOUT_SECONDS without a
    # heartbeat; this healthcheck makes the same verdict visible in `docker compose ps`.
    healthcheck:
      test: ["CMD", "python3", "/opt/sentinel/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
    deploy:
      resources:
        limits: { memory: 3g }

  # Bundled Airflow. Enabled by COMPOSE_PROFILES=airflow (the default in .env.example).
  # Leave it out to run the DAG in an Airflow you already have (docs/shared-airflow.md).
  airflow:
    profiles: ["airflow"]
    build: { context: ., dockerfile: docker/airflow/Dockerfile }
    ports: ["127.0.0.1:${AIRFLOW_PORT:-18080}:8080"]
    environment:
      <<: *sentinel-env
      DUCKDB_PATH: /opt/airflow/data/sentinel.duckdb
      DBT_TARGET: docker
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command: ["bash", "-c", "airflow scheduler & exec airflow webserver"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./dbt:/opt/sentinel/dbt
      - airflow-data:/opt/airflow/data
    depends_on:
      postgres: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # ------------------------------------------------------------------ serving
  grafana:
    image: grafana/grafana:11.2.2
    ports: ["127.0.0.1:${GRAFANA_PORT:-13000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinel.json
      SENTINEL_DB_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres: { condition: service_healthy }

# A fixed network name lets another compose project (e.g. a shared Airflow) join it.
networks:
  default:
    name: sentinel-net

volumes:
  kafka-data:
  s3-data:
  pg-data:
  airflow-data:
