apiVersion: 1
datasources:
  - name: Sentinel Postgres
    uid: sentinel-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    isDefault: true
    jsonData:
      database: sentinel
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: grafana
