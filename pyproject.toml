[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-lakehouse"
version = "0.1.0"
description = "Streaming + batch lakehouse for credential-abuse and account-takeover detection."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Praiz Ogbebor" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
generator = ["confluent-kafka>=2.4", "boto3>=1.34"]
spark = ["pyspark==3.5.3", "delta-spark==3.2.1", "psycopg2-binary>=2.9"]
dbt = ["dbt-core>=1.10", "dbt-duckdb>=1.9", "duckdb>=1.1"]
dev = [
    "sentinel-lakehouse[dbt]",
    "pyspark==3.5.3",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
sentinel-generate = "sentinel.generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["airflow"]
known-first-party = ["sentinel"]
