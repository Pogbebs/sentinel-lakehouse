name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      # Full pipeline on a small slice: generator -> Spark -> dbt models + data tests,
      # including the detection-quality gate. A rule change that hurts precision or
      # recall fails the build here.
      - name: End-to-end demo
        run: MINUTES=120 make demo

      - name: Validate compose file
        run: docker compose config --quiet
